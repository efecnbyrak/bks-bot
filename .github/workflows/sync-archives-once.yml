name: Sync Archives (One-Time)

on:
  workflow_dispatch:
    inputs:
      folder_key:
        description: 'Archive folder key (arşiv kökündeki klasör adıyla birebir aynı olmalı, örn. 2025-2026)'
        required: true
        default: '2025-2026'
        type: string
      sync_mode:
        description: 'Sync mode'
        required: true
        type: choice
        default: 'archive-full'
        options:
          - 'archive-full'
          - 'normal'

jobs:
  sync-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build TypeScript
        run: npm run build
      - name: Run archive sync
        run: node dist/index.js
        env:
          SYNC_FOLDER_KEY: ${{ github.event.inputs.folder_key }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_RESOURCE_KEY: ${{ secrets.GOOGLE_DRIVE_RESOURCE_KEY }}
          LOG_LEVEL: info
