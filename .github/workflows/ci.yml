name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Job seviyesinde tanımlanıyor ki her adım (generate/typecheck/test) aynı
    # env'i görsün — bir adıma özel env: bloğu diğer adımlara miras kalmıyor,
    # ilk sürümde bu yüzden testler "DATABASE_URL undefined" ile kırmızı çıktı
    # (src/db.ts modül yüklenirken PrismaClient(datasources.db.url) okuyor).
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
      DIRECT_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json engines.node: >=22 — CI bunun altında kalırsa (denendi:
          # node 20'de test script'i "test/**/*.test.ts" glob'unu genişletemiyor,
          # "Could not find" hatası veriyor) sürüm uyuşmazlığı sessizce farklı
          # hatalara yol açabiliyor.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - run: npm run typecheck

      - run: npm run test
