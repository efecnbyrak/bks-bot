name: Test Notification Flow (Temporary)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'assign: yeni atama | cancel: iptal | change: maç değişti (tek çağrıda hem iptal hem yeni atama) | cleanup: test verilerini sil'
        required: true
        type: choice
        options:
          - 'assign'
          - 'cancel'
          - 'change'
          - 'cleanup'
      test_user_id:
        description: 'Test edilecek gerçek userId (cleanup için gerekmez)'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run test script
        run: npx ts-node scripts/test-notification-flow.ts ${{ github.event.inputs.command }}
        env:
          TEST_USER_ID: ${{ github.event.inputs.test_user_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
