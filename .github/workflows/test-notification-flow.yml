name: Test Notification Flow (Temporary)

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Gerçek sistemle aynı akış. assign: 🔔 atama (anında) | update: 📝 Yardımcı Hakem değişti | reschedule: 📝 tarih/saat değişti | change: 🔄 aynı gün başka maç | cancel: ❌ iptal | glitch: yarım düzenleme, bildirim GELMEMELİ | cleanup: test maçları + test duyurularını sil'
        required: true
        type: choice
        options:
          - 'assign'
          - 'update'
          - 'reschedule'
          - 'change'
          - 'cancel'
          - 'glitch'
          - 'cleanup'
      test_user_id:
        description: 'Test edilecek gerçek userId (cleanup için gerekmez)'
        required: false
        default: ''
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # postinstall yok → npm ci Prisma Client üretmiyor. Test script'i @prisma/client
      # import ettiği için bu adım olmadan "did not initialize yet" ile çöker
      # (sync-current.yml / sync-archives-once.yml ile aynı adımlar).
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build TypeScript
        run: npm run build
      - name: Run test script
        run: npx ts-node scripts/test-notification-flow.ts ${{ github.event.inputs.command }}
        env:
          TEST_USER_ID: ${{ github.event.inputs.test_user_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
