name: Sync Current Season

on:
  schedule:
    - cron: '*/5 * * * *'
  # GitHub'ın kendi schedule tetikleyicisi yoğunlukta gecikebiliyor/atlanabiliyor.
  # cron-job.org gibi bir dış servisin 5 dk'da bir attığı POST isteğiyle bu event
  # tetiklenerek daha güvenilir bir zamanlama sağlanıyor. schedule tetikleyicisi
  # yedek olarak kalıyor.
  repository_dispatch:
    types: [external-cron]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Jitter atla ve zorla sync yap'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build TypeScript
        run: npm run build
      - name: Run sync
        run: node dist/index.js
        env:
          # current dışında en güncel sezon arşivi de otomatik taranır — federasyon sezon
          # geçişinde güncel maçları bazen hâlâ arşiv klasörüne ekleyebiliyor. "latest-season"
          # her çalıştırmada ARCHIVE_ROOT_ID altındaki en yeni "YYYY-YYYY" klasörünü bulur,
          # böylece sezon değiştiğinde bu değerin elle güncellenmesine gerek kalmaz.
          SYNC_FOLDER_KEY: current,latest-season
          SYNC_MODE: normal
          FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_RESOURCE_KEY: ${{ secrets.GOOGLE_DRIVE_RESOURCE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          LOG_LEVEL: info
