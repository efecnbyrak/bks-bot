name: Sync Current Season

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Jitter atla ve zorla sync yap'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Push schema to DB
        run: npx prisma db push --skip-generate --accept-data-loss
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build TypeScript
        run: npm run build
      - name: Run sync
        run: node dist/index.js
        env:
          # current dışında 2025-2026 arşivi de taranır — federasyon sezon geçişinde
          # güncel maçları bazen hâlâ arşiv klasörüne ekleyebiliyor
          SYNC_FOLDER_KEY: current,2025-2026
          SYNC_MODE: normal
          FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_RESOURCE_KEY: ${{ secrets.GOOGLE_DRIVE_RESOURCE_KEY }}
          LOG_LEVEL: info
