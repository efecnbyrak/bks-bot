name: Sync Current Season

on:
  # GitHub'ın kendi schedule tetikleyicisi yoğunlukta gecikebiliyor/atlanabiliyor
  # (bilinen bir GitHub Actions davranışı). Bunun yerine cron-job.org'un 1 dk'da bir
  # attığı POST isteğiyle bu event tetikleniyor — tek ve güvenilir zamanlama kaynağı.
  # schedule tetikleyicisi bilinçli olarak KALDIRILDI: iki ayrı tetikleyicinin aynı
  # anda çalışması, acquireLock'taki check-then-act (atomik olmayan) kilit deseninde
  # teorik bir race window açıyordu — tek kaynağa indirerek bu risk tamamen kapatıldı.
  repository_dispatch:
    types: [external-cron]
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Asgari aralığı atla ve zorla sync yap'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dry_run:
        description: 'Bildirim/DB yazma yapma, sadece ne yapacağını logla (NOTIFY_DRY_RUN)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

# Tetikleyici dakikada bir geliyor (cron-job.org). Bir çalışma sürerken gelen yeni
# tetikleme iptal edilmez, sıraya girer (en fazla 1 bekleyen) — üst üste binme yok,
# biten çalışmanın ardından en güncel veriyle bir sonraki hemen başlar.
concurrency:
  group: sync-current
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      # Hız (2026-10-27): node_modules (+ içindeki üretilmiş Prisma client) önbellekte.
      # Anahtar package-lock + schema.prisma hash'i — biri değişirse önbellek tutmaz,
      # npm ci + prisma generate baştan çalışır (eski client ile yazma riski yok).
      - name: Restore node_modules cache
        id: nm-cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-node22-${{ hashFiles('package-lock.json', 'prisma/schema.prisma') }}
      - name: Install dependencies
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Generate Prisma client
        if: steps.nm-cache.outputs.cache-hit != 'true'
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
      - name: Build TypeScript
        run: npm run build
      - name: Run sync
        run: node dist/index.js
        env:
          # current dışında en güncel sezon arşivi de otomatik taranır — federasyon sezon
          # geçişinde güncel maçları bazen hâlâ arşiv klasörüne ekleyebiliyor. "latest-season"
          # her çalıştırmada ARCHIVE_ROOT_ID altındaki en yeni "YYYY-YYYY" klasörünü bulur,
          # böylece sezon değiştiğinde bu değerin elle güncellenmesine gerek kalmaz.
          SYNC_FOLDER_KEY: current,latest-season
          SYNC_MODE: normal
          FORCE_SYNC: ${{ github.event.inputs.force_sync || 'false' }}
          # '1' ise: atama taşıma, satır iptali ve push GÖNDERİMİ yapılmaz — sadece loglanır.
          NOTIFY_DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_RESOURCE_KEY: ${{ secrets.GOOGLE_DRIVE_RESOURCE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY_BASE64 }}
          # TBF/FIBA/Milli maçları (TBL, EuroLeague, BGL, BSL, KBSL vb.) — Drive değil, iki
          # canlı Google E-Tablosu (src/tbf-milli-sync.ts). OAuth kimliği bks-web-system
          # reposuyla AYNI (lib/google-oauth.ts) — Sheets okuma yetkisi olan tek hesap o.
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TBF_MILLI_CURRENT_SHEET_ID: "13vqGkED9g946sOTu6YvPDkpbOru3NvXMRWKA10KkInc"
          TBF_MILLI_ARCHIVE_SHEET_ID: "1yyONb3WuR_ySyOZ_7SQ9HfAWl3-mZqC5KV9CXEnsZ5k"
          LOG_LEVEL: info
